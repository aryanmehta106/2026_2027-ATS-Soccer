<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wednesday Soccer RSVP</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

h1 {
    color: #2e7d32;
}

.stats {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.stat {
    flex: 1;
    min-width: 120px;
    text-align: center;
    padding: 15px;
    border-radius: 10px;
    color: white;
}

.in { background: #2e7d32; }
.maybe { background: #f9a825; }
.out { background: #c62828; }

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    margin-bottom: 15px;
}

button {
    background: #2e7d32;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #1b5e20;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h1>⚽ Wednesday Night Soccer</h1>
<p><strong>Date:</strong> October 1, 2026</p>
<p><strong>Time:</strong> 7:00 PM</p>
<p><strong>Location:</strong> Bechtel Park</p>
</div>

<div class="card">
<h2>RSVP</h2>

<label>Name</label>
<input type="text" id="playerName">

<label>Status</label>
<select id="playerStatus">
    <option value="In">✅ In</option>
    <option value="Maybe">🤔 Maybe</option>
    <option value="Out">❌ Out</option>
</select>

<button onclick="submitRSVP()">Submit RSVP</button>
</div>

<div class="card">
<h2>Attendance Summary</h2>

<div class="stats">
    <div class="stat in">
        <h2 id="inCount">0</h2>
        <p>In</p>
    </div>

    <div class="stat maybe">
        <h2 id="maybeCount">0</h2>
        <p>Maybe</p>
    </div>

    <div class="stat out">
        <h2 id="outCount">0</h2>
        <p>Out</p>
    </div>
</div>

</div>

<div class="card">
<h2>Players</h2>

<table>
<thead>
<tr>
    <th>Name</th>
    <th>Status</th>
</tr>
</thead>

<tbody id="playerTable">
</tbody>

</table>
</div>

</div>

<script>

let players = JSON.parse(localStorage.getItem("soccerPlayers")) || [];

function submitRSVP() {

    const name = document.getElementById("playerName").value.trim();
    const status = document.getElementById("playerStatus").value;

    if (!name) {
        alert("Please enter your name.");
        return;
    }

    const existing = players.find(p => p.name === name);

    if (existing) {
        existing.status = status;
    } else {
        players.push({
            name,
            status
        });
    }

    localStorage.setItem("soccerPlayers", JSON.stringify(players));

    document.getElementById("playerName").value = "";

    renderTable();
}

function renderTable() {

    const table = document.getElementById("playerTable");

    table.innerHTML = "";

    let inCount = 0;
    let maybeCount = 0;
    let outCount = 0;

    players.forEach(player => {

        if(player.status === "In") inCount++;
        if(player.status === "Maybe") maybeCount++;
        if(player.status === "Out") outCount++;

        table.innerHTML += `
        <tr>
            <td>${player.name}</td>
            <td>${player.status}</td>
        </tr>
        `;
    });

    document.getElementById("inCount").innerText = inCount;
    document.getElementById("maybeCount").innerText = maybeCount;
    document.getElementById("outCount").innerText = outCount;
}

renderTable();

</script>

</body>
</html>
